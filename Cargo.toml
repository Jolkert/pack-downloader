[package]
name = "modpack-installer"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.40"
clap = { version = "4.5.4", features = ["derive"] }
env_logger = "0.11.7"
homedir = "0.3.4"
log = "0.4.26"
regex = "1.11.1"
reqwest = "0.12.15"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["full"] }
toml = "0.8.20"
urlencoding = "2.1.3"
